<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px 20px;
        }

        /* ===== MENU (MỚI) ===== */
        .nav {
            background-color: #1e40af;
            margin: -30px -20px 30px;
            padding: 0 20px;
        }

        .nav ul {
            list-style: none;
            margin: 0 auto;
            padding: 0;
            max-width: 1100px;
            display: flex;
            gap: 4px;
        }

        .nav a {
            display: block;
            padding: 15px 18px;
            color: #dbeafe;
            text-decoration: none;
            font-weight: bold;
        }

        .nav a:hover {
            color: #fff;
        }

        .nav a.active {
            color: #fff;
            box-shadow: inset 0 -3px 0 #93c5fd;
        }
        /* ===== HẾT MENU ===== */

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 13px 22px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #productList {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product {
            background-color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product img {
            width: 100%;
            height: 190px;
            object-fit: contain;
            border-radius: 8px;
            background-color: #fff;
        }

        .product h3 {
            color: #1e40af;
        }

        .price {
            color: #e11d48;
            font-weight: bold;
            font-size: 18px;
        }

        #message {
            text-align: center;
            color: red;
            font-size: 17px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            #productList {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            #productList {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- MENU (MỚI) -->
    <nav class="nav" aria-label="Menu chính">
        <ul>
            <li><a href="index.html" class="active">Trang chủ</a></li>
            <li><a href="dangky.html">Đăng Ký</a></li>
            <li><a href="demtg.html">Đếm ngược</a></li>
            <li><a href="game.html">Game</a></li>
            <li><a href="traloi.html">Câu hỏi</li>
             <li><a href="thongtin.html">Thông tin</li>
        </ul>
    </nav>

    <div class="container">

        <h1>🛍️ DANH SÁCH SẢN PHẨM</h1>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Nhập tên sản phẩm cần tìm..."
            >
            <button onclick="searchProducts()">Tìm kiếm</button>
        </div>

        <div id="productList"></div>

        <p id="message" role="status"></p>

    </div>

    <script>

        // Mảng chứa danh sách sản phẩm và hình ảnh
        const products = [
            {
                name: "Điện thoại iPhone 18 Pro",
                price: 41990000,
                image: "https://cdnv2.tgdd.vn/pim/cdn/images/202610/iphone-18-pro-1171133.jpg"
            },
            {
                name: "Điện thoại iPhone 17 Pro",
                price: 27000000,
                image: "https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcTorKZ2MLxM7RHGQGF-bGSS5AZuOV-mk6srEqVp6tdoRERkZBLWL5rOI0CrbGKvwIba-oomELHVs3vwjAp2-NY0z6zR99TPjbB4prwgq6CptIQHoiQMlIu2yJlEjTM1VETbCkMdLQ&usqp=CAc"
            },
            {
                name: "Điện thoại iPhone 16 Pro",
                price: 21500000,
                image: "https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcQLSeZkc25bXiBeZzkp30WncICrx9f0sZowOi21E6CJOKPHAkUA_rcp7e0rru7d5QaIm604EeCkqkg1Z11ujyRxPbEJK61KwnNqncu2CeNpfLa1OLt6eWF8KwLBq6qKYu0KNKTKF28&usqp=CAc"
            },
            {
                name: "Điện thoại iPhone Duo",
                price: 64900000,
                image: "https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcS9iZHoRFRN9l25eWwvaiCXD0jq4Q4ytdDDNzghZKgmRdRCBLRvBddzrBdMfx5kCnTbgwhebvpHBN0_L0zF3i7Ezr6Ou5xvEXAi1NbTnmvP_HieRct456yvKgWI-qL5FWPFRrFk5irSUA&usqp=CAc"
            },
            {
                name: "Điện thoại iPhone 15 ",
                price: 19500000,
                image: "https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcSrMtDjX_0MQV4r6jqDy1qP7qYpXmtiK-aZ9RBD4GaJ75ryBwn1wNpKSg7b9UD84MBToSZc5vOJaWLDNrlaN5zdKgVrrP7QeX0JI_jpnFQQ3AZNeRmWwT8-V224Awr0WGst7etmB7zE&usqp=CAc"
            },
            {
                name: "Tai nghe AirPods Pro ",
                price: 6900000,
                image: "https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcQiql3RueQdlH4dyEkkTmfhh-Ug-JJrdGlSIGuK5eQ9WOjfohR5I3CFSZK48q4UGs4plKEVM3oyV-37xD6ftHCjljcefSZ2_tEAZrXF3k1tW5Qnh1C6nAg5--lWkPYed1SxmIcUAD8gJg&usqp=CAc"
            }
        ];

        // Hiển thị danh sách sản phẩm
        function displayProducts(list) {

            const productList = document.getElementById("productList");
            const message = document.getElementById("message");

            productList.replaceChildren();
            message.textContent = "";

            if (list.length === 0) {
                message.textContent = "Không tìm thấy sản phẩm!";
                return;
            }

            list.forEach(product => {

                const card = document.createElement("div");
                card.className = "product";

                // Tạo hình ảnh
                const img = document.createElement("img");
                img.src = product.image;
                img.alt = product.name;
                img.loading = "lazy";

                // Tạo tên sản phẩm
                const name = document.createElement("h3");
                name.textContent = product.name;

                // Tạo giá sản phẩm
                const price = document.createElement("p");
                price.className = "price";
                price.textContent =
                    product.price.toLocaleString("vi-VN") + " VNĐ";

                card.append(img, name, price);
                productList.appendChild(card);

            });
        }

        // Chức năng tìm kiếm
        function searchProducts() {

            const keyword = document
                .getElementById("searchInput")
                .value.trim()
                .toLowerCase();

            const result = products.filter(product =>
                product.name.toLowerCase().includes(keyword)
            );

            displayProducts(result);
        }

        // Nhấn Enter để tìm kiếm
        document.getElementById("searchInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    searchProducts();
                }

            });

        // Hiển thị tất cả sản phẩm khi mở trang
        displayProducts(products);

    </script>

</body>
</html>
